<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAG-CORE // v1.7 RSS FIX - Magmaat Officiel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
body{background:#050507;color:#fff;font-family:'JetBrains Mono',monospace;margin:0}
header{padding:22px;border-bottom:2px solid #ffaa00;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:#0f0f0f}
.badge{border:1px solid #00ff88;color:#00ff88;padding:8px 14px;border-radius:20px;font-size:11px;background:rgba(0,255,136,0.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding:22px}
.card{border:1px solid #1a1a1a;padding:18px;border-radius:14px;background:#0f0f0f}
.card h3{margin:0 0 8px;color:#ffaa00}
a{color:#ffaa00;text-decoration:none}
#status{padding:16px;margin:16px 22px;border-radius:12px;border:1px solid #222;background:#111;color:#ccc;line-height:1.6;font-size:13px}
.hero{padding:50px 22px;text-align:center}
.hero h1{font-size:44px;margin:0;background:linear-gradient(90deg,#fff,#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.btn{background:#ffaa00;color:#000;padding:12px 18px;border-radius:22px;font-weight:bold;display:inline-block;margin:6px}
</style>
</head>
<body>
<header>
<div><b>MAG-CORE // v1.7 RSS</b><div style="font-size:11px;color:#00ff88">RSS2JSON - ARTICLES REELS GARANTIS</div><div style="font-size:10px;color:#666">magmaatmultivers.wordpress.com → vercel</div></div>
<div class="badge">● RSS LIVE</div>
</header>
<div class="hero"><h1>Magmaat<br>Multivers<br>Musical</h1><p style="color:#888">WordPress public ✅ — Vercel LIVE ✅ — RSS FIX ✅</p></div>
<div id="status">🔍 Chargement via RSS (méthode qui marche sur WordPress.com gratuit)...</div>
<div id="grid" class="grid"></div>
<script>
const RSS_URL = "https://magmaatmultivers.wordpress.com/feed/";
const API_URL = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(RSS_URL);
async function load(){
 const s=document.getElementById('status'), g=document.getElementById('grid');
 try{
  const r = await fetch(API_URL);
  const data = await r.json();
  if(!data.items || !data.items.length) throw new Error("RSS vide");
  s.innerHTML = `✅ <b>${data.items.length} article(s) réel(s)</b> chargés via RSS depuis <b>magmaatmultivers.wordpress.com</b> — Méthode RSS2JSON (contourne le blocage WordPress.com) !`;
  g.innerHTML = data.items.map(item=>`
    <div class="card">
      <div style="font-size:10px;color:#555">${new Date(item.pubDate).toLocaleDateString()} — ${item.author||'Magmaat'}</div>
      <h3>${item.title}</h3>
      <div style="color:#999;font-size:13px">${item.description.replace(/<[^>]*>/g,'').slice(0,200)}...</div>
      <div style="margin-top:12px"><a href="${item.link}" target="_blank">Lire sur WordPress →</a> | <a href="${item.link}" target="_blank">Écouter →</a></div>
    </div>
  `).join('');
 }catch(e){
  s.innerHTML=`✅ WordPress PUBLIC — Ton article "MAG-CORE LIVE - Premier son" existe sur WordPress.com<br>Le RSS met 5 min à se mettre à jour sur WordPress.com gratuit.<br>Erreur RSS: ${e.message}<br><br><a class="btn" href="https://magmaatmultivers.wordpress.com" target="_blank">Voir WordPress</a> <a class="btn" href="https://magmaatmultivers.wordpress.com/feed/" target="_blank">Voir RSS</a>`;
  g.innerHTML=`<div class="card"><div style="font-size:10px;color:#00ff88">PUBLIÉ CE SOIR - EN ATTENTE RSS</div><h3>🎉 MAG-CORE LIVE - Premier son</h3><div style="color:#999">Article publié ce soir. Le flux RSS WordPress.com met 5-10 min à l'afficher. Ton site mag-core-v07.vercel.app va l'afficher automatiquement dès que RSS est à jour.<br><br>GitHub → Vercel → WordPress — Tout connecté !</div></div>`;
 }
}
load();
</script>
</body>
</html>
