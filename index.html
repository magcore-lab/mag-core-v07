<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAG-CORE // v1.8 SON - Magmaat Officiel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
:root{--orange:#ffaa00;--green:#00ff88;--bg:#050507;--card:#0f0f0f}
*{box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:'JetBrains Mono',monospace;margin:0;padding-bottom:110px}
header{padding:18px 22px;border-bottom:2px solid var(--orange);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:var(--card);position:sticky;top:0;z-index:10}
.badge{border:1px solid var(--green);color:var(--green);padding:8px 14px;border-radius:20px;font-size:11px;background:rgba(0,255,136,0.15)}
.hero{padding:40px 22px 10px;text-align:center}
.hero h1{font-size:46px;margin:0;background:linear-gradient(90deg,#fff,var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:0.95}
#status{padding:14px 16px;margin:16px 22px;border-radius:12px;border:1px solid #222;background:#111;color:#ccc;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;padding:18px 22px}
.card{border:1px solid #1e1e1e;padding:18px;border-radius:16px;background:var(--card);transition:0.2s}
.card:hover{border-color:var(--orange);transform:translateY(-2px)}
.card.playing{border-color:var(--orange);box-shadow:0 0 20px rgba(255,170,0,0.2)}
.card h3{margin:8px 0;color:var(--orange);font-size:18px}
.play-btn{width:54px;height:54px;border-radius:50%;background:var(--orange);color:#000;border:none;font-size:20px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.wave{display:flex;align-items:end;gap:3px;height:22px;margin:8px 0}
.wave span{width:3px;background:var(--orange);border-radius:2px;animation:wave 0.8s infinite ease-in-out}
@keyframes wave{0%,100%{height:6px}50%{height:22px}}
.wave.idle span{animation:none;height:4px;background:#333}
.progress{flex:1;height:4px;background:#222;border-radius:2px;overflow:hidden}
.progress-bar{height:100%;background:var(--orange);width:0%}
.btn{color:var(--orange);text-decoration:none;font-size:12px;border:1px solid #222;padding:6px 10px;border-radius:18px}
#player-bar{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:2px solid var(--orange);padding:12px 16px;display:flex;align-items:center;gap:14px;z-index:99;transform:translateY(100%);transition:0.35s}
#player-bar.active{transform:translateY(0)}
.p-info{flex:1}
.p-title{font-size:13px;font-weight:700}
.p-btn{background:var(--orange);border:none;width:42px;height:42px;border-radius:50%;font-weight:800}
</style>
</head>
<body>
<header><div><b>MAG-CORE // v1.8 SON</b><div style="font-size:11px;color:#00ff88">RSS + AUDIO PLAYER</div></div><div class="badge">● SON LIVE</div></header>
<div class="hero"><h1>Magmaat<br>Multivers<br>Musical</h1><p style="color:#888">WordPress ✅ Vercel ✅ RSS ✅ <b style="color:#ffaa00">SON BRANCHÉ 🔊</b></p></div>
<div id="status">🔊 Chargement du son via RSS...</div>
<div id="grid" class="grid"></div>
<div id="player-bar"><div style="width:48px;height:48px;background:linear-gradient(135deg,#111,#ffaa00);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000">M</div><div class="p-info"><div class="p-title" id="p-title">Aucun son</div><div class="progress" id="p-progress"><div class="progress-bar" id="p-bar"></div></div></div><button class="p-btn" id="p-play">▶</button><audio id="audio"></audio></div>
<script>
const RSS_URL="https://magmaatmultivers.wordpress.com/feed/";
const API_URL="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(RSS_URL);
function extractAudio(item){
 if(item.enclosure&&item.enclosure.link&&/\.(mp3|m4a|wav|ogg)$/i.test(item.enclosure.link)) return item.enclosure.link;
 const html=(item.description||'')+(item.content||''); const m=html.match(/https?:\/\/[^\s"'<>]+\.(mp3|m4a|wav|ogg)(\?[^\s"'<>]*)?/i); if(m) return m[0]; return null;
}
let currentCard=null; const audio=document.getElementById('audio'); const pBar=document.getElementById('player-bar'); const pTitle=document.getElementById('p-title'); const pPlay=document.getElementById('p-play'); const pBarInner=document.getElementById('p-bar');
function setTrack(item,btn){
 const url=item._audio; if(!url){alert("Pas de MP3. Dans WordPress > Articles > Modifie l'article > Bloc Audio > Upload MP3 > Publie !"); return;}
 if(currentCard) currentCard.classList.remove('playing'); currentCard=btn.closest('.card'); currentCard.classList.add('playing'); pTitle.textContent=item.title; pBar.classList.add('active'); audio.src=url; audio.play(); pPlay.textContent="⏸"; document.querySelectorAll('.play-btn').forEach(b=>b.textContent='▶'); btn.textContent='⏸';
}
audio.addEventListener('timeupdate',()=>{pBarInner.style.width=(audio.currentTime/audio.duration*100||0)+'%';});
pPlay.addEventListener('click',()=>{if(audio.paused){audio.play();pPlay.textContent='⏸'}else{audio.pause();pPlay.textContent='▶'}});
async function load(){
 const s=document.getElementById('status'), g=document.getElementById('grid');
 const r=await fetch(API_URL); const data=await r.json(); const items=data.items.map(it=>{it._audio=extractAudio(it);return it;});
 s.innerHTML=`✅ ${items.length} article(s) — ${items.filter(i=>i._audio).length} avec son`;
 g.innerHTML=items.map((item,idx)=>`<div class="card"><div style="font-size:10px;color:#555">${new Date(item.pubDate).toLocaleDateString()} ${item._audio?'🔊 SON DISPO':'🎵 AJOUTE MP3'}</div><h3>${item.title}</h3><div class="wave"><span></span><span></span><span></span><span></span></div><div style="color:#999;font-size:13px">${item.description.replace(/<[^>]*>/g,'').slice(0,160)}...</div><div style="display:flex;align-items:center;gap:12px;margin-top:12px"><button class="play-btn" data-idx="${idx}">${item._audio?'▶':'🎵'}</button><a class="btn" href="${item.link}" target="_blank">Lire</a></div></div>`).join('');
 g.querySelectorAll('.play-btn').forEach(btn=>{btn.addEventListener('click',()=>{const it=items[parseInt(btn.dataset.idx)]; if(btn.textContent==='⏸'){audio.pause();btn.textContent='▶';pPlay.textContent='▶';return;} setTrack(it,btn);});});
}
load();
</script>
</body>
</html>
