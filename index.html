<script>
const lerp = (a,b,t) => a + (b-a)*t;
const damp = (c,t,l=0.08,dt=1) => lerp(c,t,1-Math.exp(-l*dt));
const edgeInterpolate = (f,to,t) => f+(to-f)*(1-Math.pow(1-t,3));
const smoothStep = (t) => t*t*(3-2*t);
const map = (v,inMin,inMax,outMin,outMax) => outMin+((v-inMin)*(outMax-outMin))/(inMax-inMin);
const spring = (c,t,vel,s=0.15,d=0.8) => { const f=(t-c)*s; vel=(vel+f)*d; return { value: c+vel, velocity: vel }; };
