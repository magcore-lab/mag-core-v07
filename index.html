:root{--magma:#ff7a18;--bg:#050507;--line:#1e1e20;--text:#f5f5f3}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;overflow-x:hidden}
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;padding:14px 20px;background:rgba(5,5,7,.9);border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.3em;color:#666}

.hero{min-height:100vh;display:flex;align-items:center;padding:90px 24px 60px;background:radial-gradient(700px 500px at 65% 40%, rgba(255,122,24,.22), transparent 70%), linear-gradient(180deg,#0a0a0c,#050507)}
.wrap{max-width:1200px;margin:0 auto;width:100%}
.logo{font-size:clamp(48px,9vw,120px);font-weight:800;letter-spacing:-.04em;line-height:.85}
.logo span{color:var(--magma)}
.kicker{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.44em;color:var(--magma);margin-top:24px;text-transform:uppercase}
.h1{font-size:clamp(28px,5vw,52px);line-height:.95;margin-top:14px;max-width:12ch}
.concept{font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.8;color:#888;max-width:42ch;margin-top:20px}
.btns{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:16px 28px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-decoration:none;border:1px solid;transition:.2s}
.btn-p{background:var(--magma);color:#000;border-color:var(--magma)}
.btn-g{color:#fff;border-color:#2a2a2e}
.btn:hover{transform:translateY(-1px)}
.section{max-width:1200px;margin:0 auto;padding:70px 24px;border-top:1px solid var(--line)}
.card{background:#101012;border:1px solid var(--line);border-radius:20px;padding:24px}
footer{padding:28px 24px;border-top:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:9px;color:#555;display:flex;justify-content:space-between}
@media(max-width:700px){.logo{font-size:56px}.h1{font-size:36px}}
</style>
</head>
<body>
<div class="topbar"><div>MAG-CORE // PARIS 2027</div><div class="badge">● CORE LIVE</div></div>

</div></div>

</section>
